# DigitalOcean App Platform definition for the hosted playmat.
#
# Create the app once:        doctl apps create --spec .do/app.yaml
# Apply later edits to this:  doctl apps update <app-id> --spec .do/app.yaml
# Deploys come from .github/workflows/deploy.yml, which runs
# `doctl apps create-deployment` on every push to main that changes
# anything outside cardsets/ (and when started by hand); App Platform then
# builds the Dockerfile and deploys it. App Platform's own deploy-on-push
# is off (deploy_on_push below), so a push that changes only card-set data
# never restarts the playmat: that data is published to the bucket by
# .github/workflows/publish-cardsets.yml and picked up while it runs.
# Pushes to other branches do not deploy. Edits to this file still need
# the `doctl apps update` above.
#
# Domain, DNS and Google sign-in changes (the move to tcgreplay.app, and
# later retiring tcgreplay.demo.gs) follow docs/domain-move.md, in order.
#
# Users sign in with Google (see TCGREPLAY_GOOGLE_CLIENT_ID below). Each
# Google account has its own game, held in memory; games left idle are
# dropped (TCGREPLAY_IDLE_TIMEOUT). Games and sign-ins are lost on every
# deploy or restart. Card data is not part of the app: card sets are
# published to the Spaces bucket separately (see cardsets/README.md) and
# the playmat loads them from the bucket's CDN at start, every 5 minutes
# (TCGREPLAY_CARDSETS_INTERVAL) and when an admin asks, so a publish needs
# no redeploy. With the TCGREPLAY_SPACES_* settings below, card images are
# also copied to that bucket under images/ (public) and the board loads
# them from its CDN, falling back to their sources if the CDN fails;
# without them, images come from their sources. Accounts named in
# TCGREPLAY_ADMINS can open /admin to check for published card sets at
# once and to clear image copies (everything, or one set).
#
# The playmat also serves the public website (built from site/ by the
# Dockerfile) at / , with the board at /board. Every deploy (each push to
# main outside cardsets/) restarts it, so a docs change also restarts the
# playmat and drops every game. The limits below (TCGREPLAY_RATE_LIMIT,
# TCGREPLAY_MAX_USERS, TCGREPLAY_IDLE_TIMEOUT) are also shown on the website, which reads them
# from this file when it is built: this file stays the one place they are
# set, and the site build fails if one goes missing. With
# TCGREPLAY_WEB_ANALYTICS_TOKEN set, website pages and the board page are
# counted by Cloudflare Web Analytics, with no cookies.
#
# Usage and error records are JSON lines on the playmat's standard output,
# naming players only by a pseudonymous player ID (TCGREPLAY_PLAYER_ID_KEY
# below); they are read in DigitalOcean Insights, with the graphs and the
# alerts below. docs/observability.md is the runbook: what is recorded,
# how to read daily usage and a player's errors, and the alert rules.
name: tcgreplay
region: lon
services:
  - name: playmat
    github:
      repo: nicholasjackson/tcgreplay
      branch: main
      # Off: .github/workflows/deploy.yml deploys instead, skipping pushes
      # that change only cardsets/.
      deploy_on_push: false
    dockerfile_path: Dockerfile
    source_dir: /
    # Plain HTTP; App Platform (and Cloudflare in front) provide HTTPS.
    http_port: 8080
    # Must stay 1: each account's game (and every sign-in) lives in this
    # instance's memory, so a second copy would not see them.
    instance_count: 1
    # Launch size, kept until the memory measurement in
    # docs/observability.md (Capacity) is done: with every place
    # (TCGREPLAY_MAX_USERS) filled, memory must stay at or below 70%.
    instance_size_slug: apps-s-1vcpu-0.5gb
    # /healthz needs no sign-in; the board's root redirects to Google.
    health_check:
      http_path: /healthz
    # Alert rules: an unexpected restart, and CPU or memory staying high.
    # The thresholds are the maintainer's to change here. The app
    # definition cannot say who an alert goes to: set the recipients once
    # in the control panel (the app's Settings > Alerts, or an Insights
    # email notification channel). Changes here need the `doctl apps
    # update` above. See docs/observability.md.
    alerts:
      - rule: RESTART_COUNT
        operator: GREATER_THAN
        value: 0
        window: FIVE_MINUTES
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
      - rule: MEM_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: TEN_MINUTES
    envs:
      # The playmat's one public address: sign-in, the assistant connection,
      # board links and the board's allowed origin all use it. Keep it the
      # same as the primary domain under domains below.
      - key: TCGREPLAY_PUBLIC_URL
        value: https://tcgreplay.app
        scope: RUN_TIME
      # Old host names the playmat has moved from (comma-separated). Their
      # /mcp tells assistants to reconnect at the public address, with no
      # sign-in, and every other path redirects there; sign-in never works
      # on them. Each must also be an ALIAS under domains below. Retire an
      # old address by removing its alias under domains, its DNS record and
      # redirect rule at Cloudflare (see docs/domain-move.md), and then this
      # entry, and applying this file with `doctl apps update`: no release
      # is needed.
      - key: TCGREPLAY_MOVED_FROM
        value: tcgreplay.demo.gs
        scope: RUN_TIME
      # The Google OAuth web client users sign in with. Set both values in
      # the App Platform control panel (Settings > playmat > Environment
      # Variables), encrypted; hosted mode will not start without them.
      # Its authorised redirect URIs include TCGREPLAY_PUBLIC_URL followed by
      # /auth/google/callback.
      - key: TCGREPLAY_GOOGLE_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: TCGREPLAY_GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      # Seals sign-ins so they survive a redeploy; at least 32 characters
      # (e.g. openssl rand -base64 48). Without it a redeploy signs
      # everyone out. Changing it signs everyone out once.
      - key: TCGREPLAY_SIGNING_KEY
        scope: RUN_TIME
        type: SECRET
      # Keys the pseudonymous player IDs that usage and error records name
      # players by, in place of their email; at least 32 characters (e.g.
      # openssl rand -base64 48). Hosted mode will not start without it.
      # Changing it changes every player's ID, so records written before
      # no longer match the same players. Set it in the control panel,
      # encrypted, and keep a copy somewhere safe.
      - key: TCGREPLAY_PLAYER_ID_KEY
        scope: RUN_TIME
        type: SECRET
      # Requests per minute per account, and places (accounts served at
      # once; a place is freed when an account's game goes idle or its last
      # sign-in ends); 0 turns either off. Changing them needs only a
      # restart.
      - key: TCGREPLAY_RATE_LIMIT
        value: "300"
        scope: RUN_TIME
      # TCGREPLAY_MAX_USERS is kept at its launch value until the memory
      # measurement in docs/observability.md (Capacity) sets it.
      - key: TCGREPLAY_MAX_USERS
        value: "10"
        scope: RUN_TIME
      # How long an account's game may go without activity before it is
      # dropped (Go duration, e.g. 2m or 1h); 0 never drops. Needs only a
      # restart.
      - key: TCGREPLAY_IDLE_TIMEOUT
        value: "60m"
        scope: RUN_TIME
      # Card image copies: the DigitalOcean Spaces bucket card images are
      # copied to and served from through its CDN. The endpoint is the
      # region's, https://<region>.digitaloceanspaces.com (never the
      # bucket's own or CDN address, which are refused); the key is a Spaces
      # access key limited to that bucket with read and write. Leave all
      # four unset to load images from their sources; setting only some
      # logs a warning and does the same. The endpoint and bucket are not
      # secret, but are declared without values so all four are set
      # together in the control panel (encrypted), like the Google client.
      # Card data never comes from these settings: it is read from the
      # published card sets (TCGREPLAY_CARDSETS_URL, by default this
      # bucket's CDN address).
      - key: TCGREPLAY_SPACES_ENDPOINT
        scope: RUN_TIME
        type: SECRET
      - key: TCGREPLAY_SPACES_BUCKET
        scope: RUN_TIME
        type: SECRET
      - key: TCGREPLAY_SPACES_KEY
        scope: RUN_TIME
        type: SECRET
      - key: TCGREPLAY_SPACES_SECRET
        scope: RUN_TIME
        type: SECRET
      # Admins: a comma-separated list of the Google account emails allowed
      # to use /admin to check for published card sets at once and to clear
      # card image copies (everything, or one set by its code or id). Set
      # it in the control panel; unset means nobody can use the admin page.
      # Needs only a restart.
      - key: TCGREPLAY_ADMINS
        scope: RUN_TIME
      # Visitor counting: the Cloudflare Web Analytics site token for
      # tcgreplay.app (Cloudflare dashboard > Web Analytics > the site >
      # Manage site, manual snippet; automatic injection off). Public by
      # nature: it appears in every counted page. Set it in the control
      # panel only once the privacy page describing visitor counting is
      # live; the playmat also refuses to count until its own privacy page
      # describes it. Pages are counted only for TCGREPLAY_PUBLIC_URL's
      # host. Clear it to stop counting (needs only a restart).
      - key: TCGREPLAY_WEB_ANALYTICS_TOKEN
        scope: RUN_TIME
      # A DigitalOcean API token with the cdn:read and cdn:delete scopes
      # (purging is cdn:delete, not cdn:update), used to
      # purge the bucket's CDN when an admin clears card image copies.
      # Unset means clears still delete the copies but do not purge the
      # CDN. Ignored without the four TCGREPLAY_SPACES_* settings.
      - key: TCGREPLAY_SPACES_CDN_TOKEN
        scope: RUN_TIME
        type: SECRET
ingress:
  rules:
    - component:
        name: playmat
      match:
        path:
          prefix: /
# The primary domain is the playmat's one public address
# (TCGREPLAY_PUBLIC_URL): sign-in, the assistant connection and board links
# all use it. tcgreplay.demo.gs, the old address, stays as an alias only so
# it can forward players to the new one and tell old assistant connections
# where to reconnect (TCGREPLAY_MOVED_FROM above); sign-in does not work
# there.
domains:
  - domain: tcgreplay.app
    type: PRIMARY
  - domain: tcgreplay.demo.gs
    type: ALIAS
