# DigitalOcean App Platform definition for the hosted playmat.
#
# Create the app once:        doctl apps create --spec .do/app.yaml
# Apply later edits to this:  doctl apps update <app-id> --spec .do/app.yaml
# Deploying code needs only a push to main: App Platform builds the
# Dockerfile and deploys it. Pushes to other branches do not deploy.
#
# Users sign in with Google (see TCGREPLAY_GOOGLE_CLIENT_ID below). Each
# Google account has its own game, held in memory; games left idle are
# dropped (TCGREPLAY_IDLE_TIMEOUT). Games, the card cache and every
# sign-in are lost on every deploy or restart.
name: tcgreplay
region: lon
services:
  - name: playmat
    github:
      repo: nicholasjackson/tcgreplay
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    # Plain HTTP; App Platform (and Cloudflare in front) provide HTTPS.
    http_port: 8080
    # Must stay 1: each account's game (and every sign-in) lives in this
    # instance's memory, so a second copy would not see them.
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    # /healthz needs no sign-in; the board's root redirects to Google.
    health_check:
      http_path: /healthz
    envs:
      # The address board links use and the board's allowed origin.
      # ${APP_URL} is the app's primary domain as an https URL.
      - key: TCGREPLAY_PUBLIC_URL
        value: ${APP_URL}
        scope: RUN_TIME
      # The Google OAuth web client users sign in with. Set both values in
      # the App Platform control panel (Settings > playmat > Environment
      # Variables), encrypted; hosted mode will not start without them.
      # Its authorised redirect URI is ${APP_URL}/auth/google/callback.
      - key: TCGREPLAY_GOOGLE_CLIENT_ID
        scope: RUN_TIME
        type: SECRET
      - key: TCGREPLAY_GOOGLE_CLIENT_SECRET
        scope: RUN_TIME
        type: SECRET
      # Seals sign-ins so they survive a redeploy; at least 32 characters
      # (e.g. openssl rand -base64 48). Without it a redeploy signs
      # everyone out. Changing it signs everyone out once.
      - key: TCGREPLAY_SIGNING_KEY
        scope: RUN_TIME
        type: SECRET
      # Requests per minute per account, and places (accounts served at
      # once; a place is freed when an account's game goes idle or its last
      # sign-in ends); 0 turns either off. Changing them needs only a
      # restart.
      - key: TCGREPLAY_RATE_LIMIT
        value: "300"
        scope: RUN_TIME
      - key: TCGREPLAY_MAX_USERS
        value: "10"
        scope: RUN_TIME
      # How long an account's game may go without activity before it is
      # dropped (Go duration, e.g. 2m or 1h); 0 never drops. Needs only a
      # restart.
      - key: TCGREPLAY_IDLE_TIMEOUT
        value: "60m"
        scope: RUN_TIME
ingress:
  rules:
    - component:
        name: playmat
      match:
        path:
          prefix: /
domains:
  - domain: tcgreplay.demo.gs
    type: PRIMARY
