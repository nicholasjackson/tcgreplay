# What's new: one entry per release that changes what players see, newest
# first. The website's What's new page (/docs/whats-new) shows it, and the
# build stops if an entry is missing a field or has a bad date.
#
#   date:    the day it shipped, YYYY-MM-DD
#   title:   a short headline
#   refresh: true when the release adds, removes or changes a tool, a
#            tool's description, a guide or the playmat's instructions to
#            assistants (players must refresh their connection to see it);
#            otherwise false
#   changes: short lines in plain words about what changed for players;
#            [text](/path) or [text](https://...) links are allowed
#
# Never name the playmat's old address here (only the connecting page's
# move note may), and never say TCG Replay is in ChatGPT's directory while
# site/src/lib/listing.ts says it is not listed.

- date: 2026-11-24
  title: A TCG Replay sign-in page
  refresh: false
  changes:
    - "Connecting your assistant, or opening the board in a browser that is not signed in, now shows TCG Replay's own sign-in page. Choose Sign in with Google there, as before: you keep the same account and games."

- date: 2026-11-23
  title: "Privacy page: where diagnostics are kept"
  refresh: false
  changes:
    - "The [privacy page](/privacy) now says the playmat's usage and error records and request traces are kept in Grafana Cloud, in Germany, for 14 days, with daily usage totals (no player ID) kept for six weeks. They name you only by your player ID."

- date: 2026-11-21
  title: A new look
  refresh: false
  changes:
    - "The board has a new look, with clearer readouts on the mat: HP left, damage, Energy and prizes show without opening a card."
    - "Choose a light or dark interface, and a slate, felt or navy mat, from the board's ☰ menu. The board remembers your choice."
    - "Rewind to the start of any turn, play on from any line, and see the timeline's controls without hovering. Docked below the board, the timeline can be resized and lists every turn."
    - "The attack panel says when your damage is enough to Knock Out the target, and a card in your hand now offers Card text."
    - "A new logo, and a refreshed website, with the coaching workflows grouped into After a game, Practice and Play."

- date: 2026-11-19
  title: TCG Replay is public
  refresh: true
  changes:
    - "The playmat has its own address, https://tcgreplay.app. If your assistant was connected before, remove the connection and add it again at the new address: see [the note on connecting](/docs/connect#moved)."
    - "New ChatGPT connection steps for adding the playmat as a plugin, and the ChatGPT plans that allow it: see [Get started](/docs/connect)."
    - "This What's new page, [steps to refresh your assistant's connection](/docs/connect#refresh) after an update, and [an index of all the docs](/docs)."
    - "Clearer tool names and descriptions, so your assistant picks the right tool, and a new tool that tells it which Google account you signed in with."
    - "New [terms of service](/terms) and an updated [privacy page](/privacy), linked from the foot of every page with a Get help link."
    - "The board's ☰ menu has an About tcgreplay panel with the fan-project notice, the card-data credits and where to get help."
