<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 30 30" fill="none">
  <title>TCG Replay listing icon</title>
  <!-- The listing icon: the TCG Replay mark (internal/design/mark.svg), a
       navy rounded square holding two plain cards and a replay arrow, drawn
       at 512px. It carries no trademarked game mark, name, logo or
       character. Render to icon.png with:
       rsvg-convert -w 512 -h 512 icon.svg -o icon.png -->
  <rect width="30" height="30" rx="8" fill="#13285C"/>
  <rect x="7" y="8" width="10" height="14" rx="2" transform="rotate(-12 12 15)" stroke="#5CC8F2" stroke-width="1.8"/>
  <rect x="12" y="8" width="10" height="14" rx="2" fill="#13285C" stroke="#FFFFFF" stroke-width="1.8"/>
  <path d="M15.2 17.2a2.2 2.2 0 1 0 2.2-2.2h-1" stroke="#5CC8F2" stroke-width="1.6" stroke-linecap="round"/>
</svg>
